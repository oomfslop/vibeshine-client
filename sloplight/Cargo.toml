[package]
name = "sloplight"
version = "0.1.0"
edition = "2024"
description = "Moonlight/Apollo streaming client UI built with GPUI"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
aes = "0.8"
anyhow = "1.0.104"
dirs = "7.0.0"
env_logger = "0.11.11"
futures = "0.3.34"
gethostname = "1.1.0"
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
hex = "0.4.3"
httparse = "1.10.1"
if-addrs = "0.15.0"
log = "0.4.34"
mdns-sd = "0.21.6"
percent-encoding = "2.3.2"
rand = "0.8"
rcgen = { version = "0.14.10", default-features = false, features = ["pem", "ring"] }
roxmltree = "0.21.1"
rsa = { version = "0.9.10", features = ["sha2", "pem"] }
rust-embed = "8.13.0"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2.2.0"
rustls-pki-types = "1.15.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.10"
sha2 = "0.10"
time = "0.3.55"
unicode-segmentation = "1.13.3"
uuid = { version = "1.29.0", features = ["v4"] }
x509-parser = "0.18.1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
