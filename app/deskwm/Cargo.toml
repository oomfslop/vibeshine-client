[package]
name = "deskwm"
version = "0.1.0"
edition = "2021"
description = "Desk windows: host windows of a Vibeshine desk as native macOS windows (window management for the Moonlight helper)"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-quartz-core = "0.3"
objc2-core-foundation = "0.3"
dispatch2 = "0.3"
block2 = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
debug = 1
